<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannes Meilicke</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="This site is being updated and will return shortly.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="/favicon.svg" color="#0b182a">
<link rel="stylesheet" href="/fonts.css">
<style>
  :root{ --navy:#0b182a; --navy-2:#0e1f36; --accent:#7fd0c4; --muted:#d8d5d0; }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--navy); color:var(--muted);
    font-family:"Cormorant Garamond",Georgia,serif; font-size:19px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:32px;
    background-image:radial-gradient(120% 90% at 50% 8%, rgba(127,208,196,.10) 0%, rgba(127,208,196,0) 60%);
  }
  .card{ max-width:620px; text-align:center }
  .mono{
    width:74px; height:74px; margin:0 auto 30px; border-radius:50%;
    border:1px solid rgba(127,208,196,.45); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:"Playfair Display",Georgia,serif; font-size:24px; letter-spacing:.06em;
    background:rgba(255,255,255,.03);
  }
  h1{
    font-family:"Playfair Display",Georgia,serif; font-weight:500;
    font-size:clamp(30px,5vw,44px); line-height:1.15; margin:0 0 4px; color:#f2f4f7;
  }
  .role{
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(216,213,208,.62); margin:0 0 26px;
  }
  .rule{
    width:120px; height:1px; margin:0 auto 26px;
    background:linear-gradient(90deg,transparent,rgba(127,208,196,.75),transparent);
  }
  p.lede{ font-size:21px; margin:0 0 14px; color:#e6e9ee }
  p.small{ font-size:16px; color:rgba(216,213,208,.6); margin:0 }
  .dots{ display:flex; gap:9px; justify-content:center; margin:34px 0 0 }
  .dots i{
    width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35;
    animation:breathe 2.4s ease-in-out infinite;
  }
  .dots i:nth-child(2){ animation-delay:.3s }
  .dots i:nth-child(3){ animation-delay:.6s }
  @keyframes breathe{ 0%,100%{opacity:.2; transform:scale(.85)} 50%{opacity:.9; transform:scale(1)} }
  @media (prefers-reduced-motion: reduce){ .dots i{ animation:none; opacity:.5 } }
  footer{ position:fixed; left:0; right:0; bottom:22px; text-align:center;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(216,213,208,.34) }
  footer a{ color:inherit; text-decoration:none; border-bottom:1px solid rgba(216,213,208,.22) }
  footer a:hover{ color:var(--accent); border-color:var(--accent) }
  footer span{ margin:0 10px }
</style>
</head>
<body>
  <main class="card">
    <div class="mono">HM</div>
    <h1>Hannes Meilicke</h1>
    <p class="role">Physician &amp; Psychiatric Researcher</p>
    <div class="rule"></div>
    <p class="lede">This site is currently being updated.</p>
    <p class="small">It will be back online shortly. Thank you for your patience.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
  <footer>
    <a href="/impressum.html">Impressum</a><span>&middot;</span><a href="/datenschutz.html">Datenschutz</a>
  </footer>
</body>
</html>
