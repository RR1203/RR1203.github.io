<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- What this page is allowed to load, and where it may send anything.

       The site fetches nothing from anywhere else: the fonts are our own
       files in /fonts, the pictures are in this repository, and there is not
       one external script or stylesheet. So the policy is simply "self",
       with three deliberate exceptions:

         connect-src / form-action  formsubmit.co, which the contact form
                                    posts to. Nothing else may be sent
                                    anywhere, which is the half of this that
                                    matters most - injected code cannot phone
                                    home.
         frame-src                  YouTube and Vimeo, so the video template
                                    in writing/ works the day a real embed is
                                    pasted into it rather than failing with a
                                    blank box and a console error.
         data:                      the two inline SVGs in the stylesheet.

       One honest limit: script-src has to allow 'unsafe-inline', because the
       behaviour on this site lives in inline <script> blocks - fourteen of
       them on the home page. Hashing each one would be stricter but would
       break on every edit. So this does not stop injected inline script; it
       stops that script loading anything external or sending anything out.

       frame-ancestors is absent on purpose: browsers ignore it in a meta tag,
       and GitHub Pages cannot set real headers. Clickjacking is unaddressed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
  <meta name="theme-color" content="#0b182a">
  <title>Page not found | Hannes Meilicke</title>
  <meta name="description" content="That page does not exist. Links back to the rest of the site of Hannes Meilicke.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="/favicon.svg" color="#7fd0c4">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/fonts/fraunces-hero-latin.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/fonts/cormorant-garamond-latin.woff2">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <script>
  /* The tone is settled before anything is painted.

     Dark is the default now, not the operating system's preference. The
     site was designed on navy and that is how it should be met; a visitor
     who wants the light page has a switch, and their choice is remembered
     from then on. */
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
  </script>
</head>
<body class="simple">

  <a class="skip-to" href="#main">Skip to the content</a>

        <svg class="t-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>

  <script>
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) { return; }
    var root = document.documentElement;
    var meta = document.querySelector('meta[name="theme-color"]');
    var paint = function (tone) {
      root.setAttribute("data-theme", tone);
      if (meta) { meta.setAttribute("content", tone === "light" ? "#fbf7ef" : "#0b182a"); }
      btn.setAttribute("aria-pressed", tone === "light" ? "true" : "false");
      btn.title = tone === "light" ? "Switch to the dark page" : "Switch to the light page";
    };
    paint(root.getAttribute("data-theme") || "dark");
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      paint(next);
      try { localStorage.setItem("theme", next); } catch (e) {}
    });
    /* No listener on the system preference: dark is the default and
       stays the default until the reader picks otherwise. */
  })();
  </script>
</body>
</html>
